name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: Syntax
        run: |
          python -m compileall -q app tools tests
          bash -n iso/build.sh iso/profiledef.sh tools/fetch_data.sh iso/airootfs/usr/local/bin/fruitos-session
      - name: Brain engine tests (tiny synthetic brain, no download)
        run: python -m unittest discover -s tests -v
